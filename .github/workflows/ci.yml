name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces the running check; a deployment of master is never cut short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    # Pull requests from branches of this repo are already covered by their push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and test
        run: pnpm check

      - run: pnpm build

      - name: Upload the site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    # Skipped while the repository is private: Pages isn't available there.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
